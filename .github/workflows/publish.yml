name: Publish userscript updates

on:
  workflow_run:
    workflows:
      - Validate repository
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-userscripts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  detect-releases:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        vars.USERSCRIPT_AUTO_RELEASE == 'enabled'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_releases: ${{ steps.detect.outputs.has_releases }}
      matrix: ${{ steps.detect.outputs.matrix }}
      release_count: ${{ steps.detect.outputs.release_count }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling dependencies
        run: npm ci

      - name: Fetch release branches and tags
        run: git fetch origin --prune --tags

      - name: Detect stable publishable version changes
        id: detect
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npm run release:detect -- --source-ref refs/heads/main --commit-sha "$SOURCE_SHA"

  plan-releases:
    if: ${{ needs.detect-releases.outputs.has_releases == 'true' }}
    needs: detect-releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-releases.outputs.matrix) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling dependencies
        run: npm ci

      - name: Validate repository and run tooling tests
        run: npm run check

      - name: Create validated dry-run plan
        id: plan
        env:
          SCRIPT_ID: ${{ matrix.script_id }}
          EXPECTED_VERSION: ${{ matrix.version }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/userscript-release-notes.md
        run: node tools/plan-release.js --script-id "$SCRIPT_ID" --version "$EXPECTED_VERSION" --source-ref refs/heads/main --commit-sha "$SOURCE_SHA" --dry-run

      - name: Check remote release state
        env:
          ENTRY: ${{ steps.plan.outputs.entry }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin --prune --tags

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi

          remote_ref="refs/remotes/origin/$RELEASE_BRANCH"
          released_version="Not published"
          if git show-ref --verify --quiet "$remote_ref"; then
            if ! git merge-base --is-ancestor "$remote_ref" "$SOURCE_SHA"; then
              echo "Release branch $RELEASE_BRANCH cannot be fast-forwarded to $SOURCE_SHA." >&2
              exit 1
            fi
            released_version="$(git show "$remote_ref:$ENTRY" | awk '$2 == "@version" { print $3; exit }')"
            if [[ -z "$released_version" ]]; then
              echo "Cannot read @version from $RELEASE_BRANCH:$ENTRY." >&2
              exit 1
            fi
            node -e 'require("./tools/plan-release").assertVersionAdvance(process.argv[1], process.argv[2])' "$VERSION" "$released_version"
          fi

          {
            echo "### Remote preflight"
            echo
            echo "- Current release version: $released_version"
            echo "- Candidate version: $VERSION"
            echo "- Tag is available: $TAG"
            echo "- Release branch can be updated safely: $RELEASE_BRANCH"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  promote-releases:
    if: >-
      ${{
        needs.detect-releases.outputs.has_releases == 'true' &&
        needs.plan-releases.result == 'success'
      }}
    needs:
      - detect-releases
      - plan-releases
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-releases.outputs.matrix) }}
    uses: ./.github/workflows/release.yml
    with:
      script_id: ${{ matrix.script_id }}
      version: ${{ matrix.version }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
