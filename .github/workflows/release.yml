name: Release userscript

on:
  workflow_call:
    inputs:
      script_id:
        description: Script ID from scripts.json
        required: true
        type: string
      version:
        description: Version expected in the userscript @version field
        required: true
        type: string
      dry_run:
        description: Validate and inspect remote state without changing refs or releases
        required: true
        type: boolean
      create_github_release:
        description: Create a GitHub Release with the .user.js artifact
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      script_id:
        description: Script ID from scripts.json
        required: true
        type: string
      version:
        description: Version expected in the userscript @version field
        required: true
        type: string
      dry_run:
        description: Validate and inspect remote state without changing refs or releases
        required: true
        default: true
        type: boolean
      create_github_release:
        description: Create a GitHub Release with the .user.js artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.script_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must be dispatched from main; received ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install tooling dependencies
        run: npm ci

      - name: Validate repository and run tooling tests
        run: npm run check

      - name: Create validated release plan
        id: plan
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/userscript-release-notes.md
        run: |
          args=(
            --script-id "$SCRIPT_ID"
            --version "$EXPECTED_VERSION"
            --source-ref "$GITHUB_REF"
            --commit-sha "$GITHUB_SHA"
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node tools/plan-release.js "${args[@]}"

      - name: Check remote release state
        id: remote
        env:
          ENTRY: ${{ steps.plan.outputs.entry }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git fetch origin --prune --tags

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi

          remote_ref="refs/remotes/origin/$RELEASE_BRANCH"
          released_version="Not published"
          if git show-ref --verify --quiet "$remote_ref"; then
            if ! git merge-base --is-ancestor "$remote_ref" "$GITHUB_SHA"; then
              echo "Release branch $RELEASE_BRANCH cannot be fast-forwarded to $GITHUB_SHA." >&2
              echo "Follow the recovery procedure in docs/release.md; do not force-push from this workflow." >&2
              exit 1
            fi
            released_version="$(git show "$remote_ref:$ENTRY" | awk '$2 == "@version" { print $3; exit }')"
            if [[ -z "$released_version" ]]; then
              echo "Cannot read @version from $RELEASE_BRANCH:$ENTRY." >&2
              exit 1
            fi
            node -e 'require("./tools/plan-release").assertVersionAdvance(process.argv[1], process.argv[2])' "$VERSION" "$released_version"
          fi

          echo "released_version=$released_version" >> "$GITHUB_OUTPUT"
          {
            echo "### Remote preflight"
            echo
            echo "- Current release version: $released_version"
            echo "- Candidate version: $VERSION"
            echo "- Tag is available: $TAG"
            echo "- Release branch can be updated safely: $RELEASE_BRANCH"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Atomically update release branch and tag
        if: ${{ inputs.dry_run == false }}
        env:
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          RELEASE_NAME: ${{ steps.plan.outputs.release_name }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$RELEASE_NAME"
          git push --atomic origin "$GITHUB_SHA:refs/heads/$RELEASE_BRANCH" "refs/tags/$TAG"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false && inputs.create_github_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          name: ${{ steps.plan.outputs.release_name }}
          files: ${{ steps.plan.outputs.entry }}
          body_path: ${{ steps.plan.outputs.release_notes_path }}

      - name: Record promotion result
        if: ${{ inputs.dry_run == false }}
        env:
          CODE_SYNC_URL: ${{ steps.plan.outputs.code_sync_url }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          {
            echo "### Promotion result"
            echo
            echo "The release branch and tag were updated in one atomic push."
            echo
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Tag: \`$TAG\`"
            echo "- GreasyFork source: $CODE_SYNC_URL"
            echo
            echo "A successful push makes the configured release-branch source available to the GreasyFork webhook; platform synchronization is verified separately."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
