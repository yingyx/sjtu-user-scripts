name: Promote userscript (internal)

on:
  workflow_call:
    inputs:
      script_id:
        description: Script ID from scripts.json
        required: true
        type: string
      version:
        description: Version expected in the userscript @version field
        required: true
        type: string
      source_sha:
        description: Validated commit on main to promote
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-userscript-${{ inputs.script_id }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: userscript-production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require a commit from main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid source commit: $SOURCE_SHA" >&2
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "Source commit $SOURCE_SHA is not part of main." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling dependencies
        run: npm ci

      - name: Validate repository and run tooling tests
        run: npm run check

      - name: Recreate the validated promotion plan
        id: plan
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/userscript-release-notes.md
        run: node tools/plan-release.js --script-id "$SCRIPT_ID" --version "$EXPECTED_VERSION" --source-ref refs/heads/main --commit-sha "$SOURCE_SHA"

      - name: Check remote release state
        env:
          ENTRY: ${{ steps.plan.outputs.entry }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git fetch origin --prune --tags

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi

          remote_ref="refs/remotes/origin/$RELEASE_BRANCH"
          released_version="Not published"
          if git show-ref --verify --quiet "$remote_ref"; then
            if ! git merge-base --is-ancestor "$remote_ref" "$SOURCE_SHA"; then
              echo "Release branch $RELEASE_BRANCH cannot be fast-forwarded to $SOURCE_SHA." >&2
              echo "Follow the recovery procedure in docs/release.md; never force-push a published ref." >&2
              exit 1
            fi
            released_version="$(git show "$remote_ref:$ENTRY" | awk '$2 == "@version" { print $3; exit }')"
            if [[ -z "$released_version" ]]; then
              echo "Cannot read @version from $RELEASE_BRANCH:$ENTRY." >&2
              exit 1
            fi
            node -e 'require("./tools/plan-release").assertVersionAdvance(process.argv[1], process.argv[2])' "$VERSION" "$released_version"
          fi

          {
            echo "### Remote preflight"
            echo
            echo "- Current release version: $released_version"
            echo "- Candidate version: $VERSION"
            echo "- Tag is available: $TAG"
            echo "- Release branch can be updated safely: $RELEASE_BRANCH"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Atomically update release branch and tag
        env:
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          RELEASE_NAME: ${{ steps.plan.outputs.release_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SOURCE_SHA" -m "$RELEASE_NAME"
          git push --atomic origin "$SOURCE_SHA:refs/heads/$RELEASE_BRANCH" "refs/tags/$TAG"

      - name: Record promotion result
        env:
          CODE_SYNC_URL: ${{ steps.plan.outputs.code_sync_url }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          {
            echo "### Promotion result"
            echo
            echo "The release branch and tag were updated in one atomic push."
            echo
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Tag: \`$TAG\`"
            echo "- GreasyFork source: $CODE_SYNC_URL"
            echo
            echo "The repository webhook may now ask GreasyFork to check the release-branch source. Verify the public version separately."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
