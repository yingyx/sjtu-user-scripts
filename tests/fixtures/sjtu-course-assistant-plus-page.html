<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交大选课助手+ 离线测试页</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f7f9; color: #333; font: 14px/1.5 "Microsoft YaHei", sans-serif; }
    #searchBox, #contentBox, .right_div, .fixture-note { max-width: 1280px; margin: 0 auto 14px; }
    .fixture-note { padding: 12px 14px; border: 1px solid #bce8f1; border-radius: 5px; background: #d9edf7; color: #31708f; }
    .panel { margin-bottom: 12px; border: 1px solid #bce8f1; border-radius: 4px; background: #fff; }
    .panel-heading { position: relative; padding: 10px 15px; background: #d9edf7; cursor: pointer; }
    .panel-title { margin: 0; padding-right: 50px; font-size: 16px; }
    .expand_close { position: absolute; top: 10px; right: 14px; }
    .expand1::after { content: "展开"; }
    .close1::after { content: "关闭"; }
    .panel-body { padding: 12px 15px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; vertical-align: top; }
    .right_div { display: none; }
    button { font: inherit; }
  </style>
</head>
<body>
  <div class="fixture-note">
    <strong>离线脱敏测试页</strong>：课程面板结构由 CDP 从真实选课页面提取；所有课程、教师和选课信息均为测试数据，外部网络请求已禁用。
  </div>
  <div id="searchBox"></div>
  <div id="contentBox"></div>
  <div class="right_div">
    <ul class="outer_xkxx_list">
      <li class="list-group-item">(TEST9001)已选测试课程 测试教师<p class="time">星期二第3-4节{1-16周}</p></li>
    </ul>
  </div>
  <script>
    (function buildFixture() {
      "use strict";
      const courses = [
        { code: "TEST1001", name: "单教学班示例", rows: [{ teacher: "测试教师甲", time: "星期一第1-2节{1-16周}" }] },
        { code: "TEST1002", name: "时间冲突示例", rows: [{ teacher: "测试教师乙", time: "星期二第3-4节{1-16周}" }] },
        { code: "TEST1003", name: "长文本布局示例", rows: [{ teacher: "测试教师丙", time: "星期三第6-8节{1-16周}", note: "用于检查很长的课程备注在窄屏和操作栏旁边是否正确换行" }] },
        {
          code: "TEST2001",
          name: "多教学班示例",
          rows: [
            { teacher: "测试教师丁1", time: "星期一第1-2节{1-16周}" },
            { teacher: "测试教师丁2", time: "星期二第2-3节{1-16周}" },
            { teacher: "测试教师丁3", time: "星期三第3-4节{1-16周}" },
          ],
        },
      ];

      function rowHtml(course, row, index) {
        return `<tr class="body_tr">
          <td class="do_jxb_id" style="display:none">fixture-${course.code}-${index + 1}</td>
          <td class="jsxm" style="display:none">${row.teacher}</td>
          <td class="jxbmc">(2026-2027-1)-${course.code}-0${index + 1}</td>
          <td class="jsxmzc">${row.teacher}</td>
          <td class="sksj">${row.time}</td>
          <td class="jxdd">测试教室</td>
          <td class="kkxymc">测试学院</td>
          <td class="xqumc">闵行</td>
          <td class="xkbz">${row.note || "测试备注"}</td>
          <td class="kcxz">任选</td>
          <td class="skfsmc">中文</td>
          <td class="rsxx">${10 + index} / 40</td>
          <td class="an"><button type="button" disabled>测试操作</button></td>
        </tr>`;
      }

      function panelHtml(course, index) {
        let rows = "";
        for (let i = 0; i < course.rows.length; i += 1) rows += rowHtml(course, course.rows[i], i);
        return `<div class="panel panel-info">
          <div class="panel-heading kc_head">
            <h3 class="panel-title"><span class="kcmc">(${course.code}) <a href="javascript:void(0);">${course.name}</a> - 2.0 学分</span> 教学班个数：${course.rows.length} 状态：未选</h3>
            <a class="expand_close ${index === 0 ? "close1" : "expand1"}" href="javascript:void(0);" aria-label="展开或关闭"></a>
          </div>
          <div class="panel-body table-responsive" style="display:${index === 0 ? "block" : "none"}">
            <table class="table table-hover">
              <thead><tr><th>教学班</th><th>上课教师</th><th>上课时间</th><th>教学地点</th><th>开课学院</th><th>校区</th><th>选课备注</th><th>课程性质</th><th>授课语言</th><th>已选/容量</th><th>操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
      }

      let panels = "";
      for (let i = 0; i < courses.length; i += 1) panels += panelHtml(courses[i], i);
      document.querySelector("#contentBox").innerHTML = panels;

      document.addEventListener("click", (event) => {
        const heading = event.target.closest && event.target.closest(".panel-heading.kc_head");
        if (!heading) return;
        const clickedBody = heading.parentElement.querySelector(".panel-body");
        const wasOpen = window.getComputedStyle(clickedBody).display !== "none";
        const bodies = document.querySelectorAll("#contentBox .panel-body");
        const toggles = document.querySelectorAll("#contentBox .expand_close");
        for (let i = 0; i < bodies.length; i += 1) bodies[i].style.display = "none";
        for (let i = 0; i < toggles.length; i += 1) toggles[i].className = "expand_close expand1";
        if (!wasOpen) {
          clickedBody.style.display = "block";
          heading.querySelector(".expand_close").className = "expand_close close1";
        }
      });

      window.GM_getValue = (key, fallback) => localStorage.getItem(key) ?? fallback;
      window.GM_setValue = (key, value) => localStorage.setItem(key, value);
      window.GM_xmlhttpRequest = (options) => window.setTimeout(() => {
        if (options && options.onerror) options.onerror({ status: 0 });
      }, 0);
      window.open = () => null;
    })();
  </script>
  <script src="../../scripts/sjtu-course-assistant-plus/sjtu-course-assistant-plus.user.js"></script>
</body>
</html>
